name: Build and Upload Skill ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing Git tag and Release to receive the ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-asset-${{ github.event.release.tag_name || inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
      - name: Set up release build Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate tag and package version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(node scripts/validate-release-tag.mjs "$RELEASE_TAG")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check source version and generated contracts
        run: |
          npm run check:version
          npm run contracts:check
      - name: Build and verify the exact release ZIP
        id: archive
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          npm run build:bundle:zip
          zip_path="bundle/igapyon-miku-scm-skills-${RELEASE_VERSION}.zip"
          test -s "$zip_path"
          node scripts/verify-release-zip.mjs "$zip_path"
          node scripts/write-sha256.mjs "$zip_path"
          printf 'zip=%s\n' "$zip_path" >> "$GITHUB_OUTPUT"
      - name: Upload ZIP and SHA-256
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: |
            ${{ steps.archive.outputs.zip }}
            ${{ steps.archive.outputs.zip }}.sha256
          overwrite_files: false
          fail_on_unmatched_files: true
